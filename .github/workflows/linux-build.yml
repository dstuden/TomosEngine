name: Linux Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: tomos-linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Linux)
    runs-on: ubuntu-26.04
    # Arch ships current GCC 16.x; Ubuntu 26.04's g++-16 is an early snapshot
    # with broken std::meta::annotations_of in consteval.
    container: archlinux:latest

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git cmake ninja pkgconf gcc \
            vulkan-devel shaderc ffmpeg mesa \
            libx11 libxrandr libxinerama libxcursor libxi \
            wayland wayland-protocols libxkbcommon \
            nodejs

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel "$(nproc)"
